services:
  - type: web
    name: course-job-hunter
    runtime: python
    plan: free
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn admin:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_PASSWORD
        sync: false          # set via Render dashboard (do NOT hardcode in prod)
      - key: EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: PORTAL_SECRET_KEY
        generateValue: true  # Render auto-generates a secure random secret
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
