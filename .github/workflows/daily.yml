name: Daily Course & Job Hunter

on:
  schedule:
    # Runs daily at 01:45 UTC (7:15 AM India Standard Time / IST).
    # GitHub Actions scheduled triggers often experience 15 to 40 minutes of queue latency,
    # so scheduling at 01:45 UTC ensures the digest reliably arrives around 8:00 AM IST.
    - cron: '45 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Course & Job Hunter
        env:
          EMAIL: ${{ secrets.EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RECIPIENTS_JSON: ${{ secrets.RECIPIENTS_JSON }}
        run: |
          python main.py

      - name: Commit and push updated seen.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if git diff --staged --quiet; then
            echo "No changes in seen.json to commit."
          else
            git commit -m "chore: update seen.json [skip ci]"
            git pull --rebase
            git push
          fi
