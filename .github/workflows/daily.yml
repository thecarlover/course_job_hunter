name: Daily Course & Job Hunter

on:
  schedule:
    # Primary trigger: 01:45 UTC (7:15 AM IST).
    # Runs early to compensate for 15-40 min GitHub Actions scheduler queue delays.
    - cron: '45 1 * * *'
    # Redundancy backup trigger: 02:15 UTC (7:45 AM IST).
    # If the 7:15 AM run already executed, this backup finds seen.json up to date and exits silently.
    # If GitHub's queue dropped or delayed the first trigger, this backup ensures delivery by ~8:00 AM.
    - cron: '15 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime
    inputs:
      weekly:
        description: 'Generate and send Weekly Market Insights report only'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Course & Job Hunter
        env:
          EMAIL: ${{ secrets.EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RECIPIENTS_JSON: ${{ secrets.RECIPIENTS_JSON }}
        run: |
          if [ "${{ github.event.inputs.weekly }}" = "true" ]; then
            python main.py --weekly
          else
            python main.py
          fi

      - name: Commit and push updated seen.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if git diff --staged --quiet; then
            echo "No changes in seen.json to commit."
          else
            git commit -m "chore: update seen.json [skip ci]"
            git pull --rebase
            git push
          fi
